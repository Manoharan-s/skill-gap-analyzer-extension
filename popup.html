<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>Skill Gap Analyser</title>
</head>
<body>
   
        
        <button id="closeBtn">&times;</button>
        <h2>Skill Gap Analyser</h2>
    <textarea
  id="skills"
  placeholder="Enter your skills (java,python)"
></textarea>
  <div class="button-container">
    <button id="saveBtn">Save Skills</button>
    <button id="analysebtn">
    <img id="aiIcon"
         src="icons/ChatGPT Image Jun 26, 2026, 06_46_11 PM.png">

    <span id="analyseText">
        Analyze
    </span>

</button>
</div>
    <div id="result" style="display:none;">

    <div class="result-section">

        <h3 id="matchedTitle"> Matched Skills</h3>

        <ul id="matchedSkills"></ul>

    </div>

    <hr>

    <div class="result-section">

        <h3 id="missingTitle"> Missing Skills</h3>

        <ul id="unmatchedSkills"></ul>

    </div>

</div>
 <div id="score-container" style="display:none;">

    <div class="circle">
        <div class="inner">
            <span id="score"></span>
        </div>
    </div>

    <div class="score-text">
        <h2>Match Score</h2>
        <p id="matchValue"></p>
    </div>

</div>

   
    <script src="popup.js"></script>
    
</body>
</html>
